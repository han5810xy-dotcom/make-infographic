<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对话 → 知识结构</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;width:340px;background:#f7f9fd;color:#17181c;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}h1{font-size:18px;margin:0 0 4px}p{margin:0 0 14px;color:#5c626e}button{width:100%;min-height:38px;margin:0 0 8px;border:1px solid #dce2ee;border-radius:9px;background:#fff;color:#17181c;font-weight:650;cursor:pointer}button.primary{border-color:#2f5cff;background:#2f5cff;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:40px;margin-top:6px;padding:9px 10px;border-radius:8px;background:#edf2ff;color:#29385f;font-size:12px}.status.bad{background:#fff0ec;color:#8f2f20}.meta{font-size:12px;color:#5c626e;margin-bottom:10px}
</style>
</head>
<body>
<h1>对话 → 知识结构</h1>
<p>捕获 Qwen 当前可见会话，包括页面上可见的思考过程。</p>
<div class="meta" id="meta">正在检查页面…</div>
<button class="primary" id="capture" type="button">捕获当前会话</button>
<button id="download" type="button" disabled>下载 Trace JSON</button>
<button id="copy" type="button" disabled>复制 Trace JSON</button>
<button id="bridge" type="button" disabled>发送到本机并出图</button>
<div class="status" id="status" role="status" aria-live="polite">尚未捕获。</div>
<script src="popup.js"></script>
</body>
</html>
